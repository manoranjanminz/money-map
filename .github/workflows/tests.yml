name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Statement reading and categorising
        run: node --test tests/core.test.js
      - name: Bundled app matches src/core.js
        run: |
          node -e "
          const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const c=fs.readFileSync('src/core.js','utf8').trim();
          if(!h.includes(c.slice(0,2000))||!h.includes(c.slice(-2000))){console.error('index.html is out of date with src/core.js');process.exit(1)}
          console.log('index.html includes the current src/core.js')"
